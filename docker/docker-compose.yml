version: "3.9"
services:
  database:
    image: postgres:15-alpine
    volumes:
      - psg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && celery -A youth_portal worker -l INFO"
    volumes:
      - ../backend:/app
    environment:
      - PGHOST=database
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - PGDATABASE=${PGDATABASE}
      - DJANGO_SETTINGS_MODULE=youth_portal.settings
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - database

  adminer:
    image: adminer
    ports:
      - "8080:8080"

volumes:
  psg_data:
  redis_data: